[project]
name = "ai-debugger"
version = "0.1.0"
description = "AI Debugging Assistant — RAG-based error resolution"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    # Config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    # LLM (D1)
    "openai>=1.50",
    "tenacity>=9.0",
    "azure-identity",
    # Vector DB (D4 — reserved for Phase 2)
    "pymilvus>=2.4.0",
    # OCR (D3)
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    # Utils
    "orjson>=3.10",
    "structlog>=24.4",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_debugger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true